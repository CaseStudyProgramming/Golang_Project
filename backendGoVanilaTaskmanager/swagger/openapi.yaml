  /tasks/{id}/activity-logs:
    get:
      summary: Get task activity logs
      description: Retrieve activity logs for a specific task
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Activity logs retrieved successfully
          content:
            application/json:
