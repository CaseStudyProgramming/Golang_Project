          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: Get task subtasks
      description: Get all subtasks for a task
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Subtasks retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubtasksResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /subtasks/{id}:
    get:
      summary: Get subtask by ID
      description: Retrieve a specific subtask
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Subtask retrieved successfully
          content:
            application/json:
