          description: Subtask toggled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubtaskResponse'
        '404':
          description: Subtask not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /activity-logs:
    get:
      summary: Get user activity logs
      description: Retrieve activity logs for the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Activity logs retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityLogsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /activity-logs/{id}:
    get:
      summary: Get activity log by ID
      description: Retrieve a specific activity log
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Activity log retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityLogResponse'
        '404':
