server:
  port: "8080"

database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "your_password_here"
  dbname: "taskmanager"
  sslmode: "disable"

jwt:
  secret: "your_jwt_secret_key_here_change_in_production"

cors:
  allowed_origins:
    - "http://localhost:5173"
    - "http://localhost:3000"
    - "http://localhost:8080"

# Environment Variables (Override config file values)
# DB_HOST=localhost
# DB_PORT=5432
# DB_USER=postgres
# DB_PASSWORD=postgres
# DB_NAME=taskmanager
# DB_SSLMODE=disable
# JWT_SECRET=your_jwt_secret
# APP_ENV=development
