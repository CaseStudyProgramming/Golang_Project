server:
  port: "8080"

database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "your_password_here"
  dbname: "taskmanager"
  sslmode: "disable"

jwt:
  secret: "your_jwt_secret_key_here_change_in_production"

cors:
  allowed_origins:
    - "http://localhost:5173"
    - "http://localhost:3000"
    - "http://localhost:8080"

logging:
  level: "info"
  format: "json"

app:
  env: "development"
  rate_limit:
    enabled: true
    requests_per_minute: 100
    requests_per_hour: 1000
  session:
    timeout_hours: 24

# Environment Variables (Override config file values)
# SERVER_PORT=8080
# DB_HOST=localhost
# DB_PORT=5432
# DB_USER=postgres
# DB_PASSWORD=postgres
# DB_NAME=taskmanager
# DB_SSLMODE=disable
# JWT_SECRET=your_jwt_secret
# CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
# LOG_LEVEL=info
# LOG_FORMAT=json
# APP_ENV=development
# RATE_LIMIT_ENABLED=true
# RATE_LIMIT_RPM=100
# RATE_LIMIT_RPH=1000
# SESSION_TIMEOUT_HOURS=24
