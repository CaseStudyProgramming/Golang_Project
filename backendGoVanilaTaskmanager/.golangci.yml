version: "2"

run:
  go: "1.25"
  timeout: 5m

linters:
  disable:
    - errcheck
    - ineffassign
    - unused
    - staticcheck

settings:
  govet:
    enable-all: true
    disable:
      - shadow

  gosec:
    excludes:
      - G104
      - G307

  gocritic:
    enabled-tags:
      - diagnostic
      - performance
      - style

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

  exclude-rules:
    # Exclude test files from strict rules
    - path: _test\.go
      linters:
        - staticcheck
        - gosec

    # Exclude SA1029 (context keys with string type) - common pattern in Go
    - linters:
        - staticcheck
      text: "SA1029"

    # Exclude SA4006 (unused variables) in test files
    - path: _test\.go
      linters:
        - staticcheck
      text: "SA4006"