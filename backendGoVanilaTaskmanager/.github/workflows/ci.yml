name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        
    - name: Install dependencies
      run: go mod download
      
    - name: Check code formatting
      run: |
        if [ -n "$(gofmt -l .)" ]; then
          echo "Go code is not properly formatted. Run 'gofmt -w .' to fix."
          gofmt -l .
          exit 1
        fi
        echo "✅ All Go files are properly formatted"
      
    - name: Run tests
      run: go test -v ./...
      
    - name: Run tests with race detection
      run: go test -race ./...
      
    - name: Run tests with coverage
      run: go test -cover ./...
