name: Frontend CI

on:
  push:
    branches: [ main, develop, 'feature/**', 'fix/**', 'hotfix/**', 'refactor/**', 'chore/**' ]
    paths:
      - 'sveltekit-taskmanager-frontend/**'
      - 'backendGoVanilaTaskmanager/swagger/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'sveltekit-taskmanager-frontend/**'
      - 'backendGoVanilaTaskmanager/swagger/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_call:

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      working-directory: ./sveltekit-taskmanager-frontend
      run: bun install

    - name: Generate MSW handlers from OpenAPI
      working-directory: ./sveltekit-taskmanager-frontend
      run: bun run api:generate

    - name: Format check
      working-directory: ./sveltekit-taskmanager-frontend
      run: bun run format:check

    - name: Lint
      working-directory: ./sveltekit-taskmanager-frontend
      run: bun run lint

    - name: Type check
      working-directory: ./sveltekit-taskmanager-frontend
      run: bun run check

  test:
    runs-on: ubuntu-latest
    needs: quality-checks

    steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      working-directory: ./sveltekit-taskmanager-frontend
      run: bun install

    - name: Generate MSW handlers from OpenAPI
      working-directory: ./sveltekit-taskmanager-frontend
      run: bun run api:generate

    - name: Run unit tests
      working-directory: ./sveltekit-taskmanager-frontend
      run: bun test

    - name: Run tests with coverage
      working-directory: ./sveltekit-taskmanager-frontend
      run: bun test:coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v6
      with:
        files: ./sveltekit-taskmanager-frontend/coverage/coverage-final.json
        flags: frontend
        name: frontend-coverage
        fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      working-directory: ./sveltekit-taskmanager-frontend
      run: bun install

    - name: Generate MSW handlers from OpenAPI
      working-directory: ./sveltekit-taskmanager-frontend
      run: bun run api:generate

    - name: Build application
      working-directory: ./sveltekit-taskmanager-frontend
      run: bun run build

    - name: Build Docker image
      working-directory: ./sveltekit-taskmanager-frontend
      run: docker build -t taskmanager-frontend:test .

  e2e:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Berjuang#382
          POSTGRES_DB: taskmanager_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'
        cache: true
        cache-dependency-path: backendGoVanilaTaskmanager/go.sum

    - name: Install frontend dependencies
      working-directory: ./sveltekit-taskmanager-frontend
      run: bun install

    - name: Generate MSW handlers from OpenAPI
      working-directory: ./sveltekit-taskmanager-frontend
      run: bun run api:generate

    - name: Install backend dependencies
      working-directory: ./backendGoVanilaTaskmanager
      run: go mod download

    - name: Build backend
      working-directory: ./backendGoVanilaTaskmanager
      run: go build -o taskmanager-server main.go

    - name: Start backend server
      working-directory: ./backendGoVanilaTaskmanager
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USER: postgres
        DB_PASSWORD: Berjuang#382
        DB_NAME: taskmanager_test
        SSL_MODE: disable
        JWT_SECRET: test-secret-key-for-e2e-testing-only
        PORT: 8080
      run: |
        ./taskmanager-server &
        sleep 10
        curl -f http://localhost:8080/health || exit 1

    - name: Install system dependencies for Playwright
      run: sudo apt-get update && sudo apt-get install -y libnspr4 libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64

    - name: Install Playwright browsers
      working-directory: ./sveltekit-taskmanager-frontend
      run: bunx playwright install --with-deps

    - name: Run E2E tests
      working-directory: ./sveltekit-taskmanager-frontend
      env:
        CI: true
        PUBLIC_API_BASE_URL: http://localhost:8080
      run: bun test:e2e

    - name: Upload E2E test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-report
        path: ./sveltekit-taskmanager-frontend/playwright-report/
        retention-days: 30
